# ==============================================================================
# Verdara: Spatial Climate Intelligence Platform
# Docker Compose Orchestration (compose.yaml)
# Meta Global AI Hackathon 2026 Production Specification
# ==============================================================================

version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # Service 1: Verdara Next.js 15 Web Application & Spatial 3D Twin
  # ----------------------------------------------------------------------------
  verdara-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verdara-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://your-project.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy}
      - META_API_KEY=${META_API_KEY:-}
      - META_MODEL_SPARK=${META_MODEL_SPARK:-muse-spark-1.3}
      - META_MODEL_SAM=${META_MODEL_SAM:-sam-3.1}
      - META_MODEL_IMAGE=${META_MODEL_IMAGE:-muse-image-1.0}
      - META_MODEL_WONDER=${META_MODEL_WONDER:-muse-wonder-1.0}
      - AI_MAX_TOTAL_BUDGET_USD=150.00
      - PYTHON_EVAL_SERVICE_URL=http://verdara-eval:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - verdara-network
    depends_on:
      verdara-eval:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Service 2: Verdara Python Meta AI Benchmark & Climate Physics Engine
  # ----------------------------------------------------------------------------
  verdara-eval:
    build:
      context: .
      dockerfile: services/climate_eval/Dockerfile
    container_name: verdara-eval
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - META_API_KEY=${META_API_KEY:-}
      - META_MODEL_SPARK=${META_MODEL_SPARK:-muse-spark-1.3}
      - META_MODEL_SAM=${META_MODEL_SAM:-sam-3.1}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - verdara-network

  # ----------------------------------------------------------------------------
  # Service 3: High-Performance Cache & Rate Limiting (Redis)
  # ----------------------------------------------------------------------------
  verdara-redis:
    image: redis:7-alpine
    container_name: verdara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - verdara-network

networks:
  verdara-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
