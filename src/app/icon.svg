<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vd-fav-emerald" x1="15" y1="17" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e9e5a" />
      <stop offset="100%" stop-color="#0e562e" />
    </linearGradient>
    <linearGradient id="vd-fav-lime" x1="49" y1="17" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8ff66" />
      <stop offset="100%" stop-color="#b6eb1a" />
    </linearGradient>
    <linearGradient id="vd-fav-bevel-l" x1="15" y1="13" x2="30" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ee07e" />
      <stop offset="100%" stop-color="#1a8b4e" />
    </linearGradient>
    <linearGradient id="vd-fav-bevel-r" x1="49" y1="13" x2="34" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c6f432" />
    </linearGradient>
  </defs>

  <!-- Obsidian Squircle Base -->
  <rect width="64" height="64" rx="18" fill="#08090c" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" stroke="#232730" stroke-width="1.2" />

  <!-- Left Cantilever Wing: Living Architecture (Emerald) -->
  <path d="M15 17 L26 17 L32 35.5 L32 49 L15 17 Z" fill="url(#vd-fav-emerald)" />
  <path d="M15 17 L19 13 L30 13 L26 17 Z" fill="url(#vd-fav-bevel-l)" />

  <!-- Right Cantilever Wing: Solar Kinetic (Lime) -->
  <path d="M49 17 L38 17 L32 35.5 L32 49 L49 17 Z" fill="url(#vd-fav-lime)" />
  <path d="M49 17 L45 13 L34 13 L38 17 Z" fill="url(#vd-fav-bevel-r)" />

  <!-- Central Spatial Aperture (Diamond Light Well) -->
  <path d="M32 21 L37.5 29 L32 37 L26.5 29 Z" fill="#08090c" stroke="#c6f432" stroke-width="1.2" />

  <!-- Photovoltaic Precision Louver Cuts on Right Solar Wing -->
  <line x1="39" y1="22.5" x2="45.5" y2="22.5" stroke="#08090c" stroke-width="1.5" stroke-linecap="round" />
  <line x1="36.5" y1="28" x2="43" y2="28" stroke="#08090c" stroke-width="1.5" stroke-linecap="round" />
  <line x1="34" y1="33.5" x2="39.5" y2="33.5" stroke="#08090c" stroke-width="1.5" stroke-linecap="round" />

  <!-- Living Water Node -->
  <circle cx="32" cy="29" r="2.8" fill="#2a9dbd" />
  <circle cx="31.2" cy="28.2" r="1.1" fill="#ffffff" />
</svg>
